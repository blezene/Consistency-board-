<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a26">
<title>Consistency Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040720;
  --card:rgba(12,20,74,.62);
  --line:rgba(72,104,255,.32);
  --line-soft:rgba(110,130,255,.16);
  --text:#f2f4ff;
  --muted:#9aa8e6;
  --dim:#6d7ab8;
  --p1:#6a3df5;
  --p2:#2f6bff;
  --side:112px;
  --font:'Poppins','Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);color:var(--text);font-size:14px;line-height:1.4;min-height:100vh;
  background:
    radial-gradient(1100px 650px at 12% -8%,#15216f 0%,transparent 60%),
    radial-gradient(900px 600px at 100% 28%,#1b1068 0%,transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
button:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:2px solid #86a2ff;outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
.side{
  position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:20;
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 10px;
  background:linear-gradient(180deg,rgba(9,16,66,.9),rgba(5,9,40,.94));
  border-right:1px solid var(--line-soft);
}
.nav-btn{
  width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 4px;
  border-radius:16px;color:var(--muted);font-size:12.5px;font-weight:500;border:1px solid transparent;transition:.15s;
}
.nav-btn .i{font-size:24px}
.nav-btn:hover{color:#fff;background:rgba(110,130,255,.1)}
.nav-btn.on{
  color:#fff;background:linear-gradient(180deg,rgba(88,64,255,.3),rgba(40,80,255,.18));
  border-color:rgba(100,124,255,.65);box-shadow:0 0 22px rgba(70,90,255,.35);
}
.nav-btn.on .i{color:#82a4ff;filter:drop-shadow(0 0 6px rgba(100,140,255,.8))}
.wrap{margin-left:var(--side);padding:26px 34px 70px}
.page{max-width:1120px;margin:0 auto}
.bnav{
  display:none;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;
  background:rgba(8,14,58,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;
  padding:7px;justify-content:space-around;gap:2px;box-shadow:0 10px 40px rgba(0,0,0,.55);
}
.bnav .nav-btn{padding:8px 2px;font-size:11px;gap:3px;border-radius:16px}
.bnav .nav-btn .i{font-size:22px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.avatar{
  width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:600;flex:none;
  background:linear-gradient(135deg,#7b3dff,#3a5cff);box-shadow:0 0 0 3px rgba(120,140,255,.25),0 0 34px rgba(90,80,255,.55);
}
.hello{flex:1;min-width:0}
.hello small{color:var(--muted);font-size:14px;display:block}
.hello h1{font-size:28px;font-weight:600;line-height:1.15;display:flex;align-items:center;gap:8px}
.hello .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hello .tag{color:var(--muted);font-size:15px;margin-top:2px}
.pencil{color:#8a8cff;font-size:18px;display:grid;place-items:center;padding:4px;border-radius:8px}
.pencil:hover{background:rgba(110,130,255,.18)}
.name-inp{font-size:24px;font-weight:600;background:rgba(6,10,44,.85);border:1px solid #86a2ff;border-radius:12px;padding:2px 12px;color:#fff;width:min(340px,100%);outline:0}
.top-actions{display:flex;align-items:center;gap:10px}
.autosave{font-size:12px;color:var(--dim);margin-right:2px;white-space:nowrap}
.save-btn{
  height:54px;padding:0 26px;border-radius:18px;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:17px;
  background:linear-gradient(90deg,#4a35f0,#2f63ff);border:1px solid rgba(140,160,255,.7);box-shadow:0 0 26px rgba(70,90,255,.55);transition:.2s;
}
.save-btn .i{font-size:22px}
.save-btn.saved{background:linear-gradient(90deg,#15a047,#22c55e);border-color:rgba(134,239,172,.75);box-shadow:0 0 26px rgba(34,197,94,.5)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:20px;flex:none}
.icon-btn:hover{background:rgba(110,130,255,.16);color:#fff}
.icon-btn.sm{width:32px;height:32px;font-size:17px}

/* ---------- generic ---------- */
.card{
  background:linear-gradient(180deg,rgba(14,24,84,.62),rgba(8,14,56,.68));
  border:1px solid var(--line);border-radius:22px;padding:18px 20px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02),0 0 30px rgba(50,70,255,.1);
}
.card h2{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.card h2 .i{font-size:22px;color:#8ea6ff}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:18px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:14px;
  border:1px solid var(--line);background:rgba(30,44,140,.35);font-weight:500;font-size:13.5px;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:rgba(130,156,255,.7)}
.btn.primary{background:linear-gradient(90deg,#5a3df2,#2f5fff);border-color:rgba(130,150,255,.7);box-shadow:0 0 20px rgba(70,80,255,.4)}
.btn.danger{color:#ff8fa3;border-color:rgba(244,63,94,.45)}
.btn.danger.solid{background:linear-gradient(90deg,#e11d48,#f43f5e);color:#fff;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn .i{font-size:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:12.5px;color:var(--muted)}
.inp{background:rgba(6,10,44,.85);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0;width:100%;color-scheme:dark;min-width:0}
.inp:focus{border-color:#86a2ff;box-shadow:0 0 0 3px rgba(100,130,255,.2)}
textarea.inp{resize:vertical;min-height:70px}
.bar{height:8px;border-radius:99px;background:rgba(120,140,255,.16);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p1),var(--p2));transition:width .35s}
.bar.thin{height:5px}
.linkbtn{color:#9db4ff;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.warn-card{margin-bottom:16px;padding:12px 16px;border-radius:16px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.5);color:#ffd99a;font-size:13.5px}

/* ---------- home ---------- */
.notes-card{padding:14px 20px;margin-bottom:20px}
.nh{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.nh .linkbtn{margin-left:auto;font-weight:400}
.ibadge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#7b3dff,#4a5cff);font-size:16px}
.notes-row{display:flex;align-items:flex-end;gap:12px;margin-top:6px}
.notes-row textarea{flex:1;width:100%;background:transparent;border:0;outline:0;resize:none;color:var(--text);font-size:14.5px;min-height:26px;max-height:120px;field-sizing:content;overflow:hidden}
.notes-row textarea::placeholder{color:var(--dim)}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1.18fr;gap:20px;margin-bottom:20px}
.oc{display:flex;align-items:center;gap:22px;margin-top:10px}
.ring{position:relative;width:170px;height:170px;flex:none}
.ring svg{width:100%;height:100%}
.ring .track{fill:none;stroke:rgba(90,110,255,.16);stroke-width:10}
.ring .arc{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(110,90,255,.7));transition:stroke-dashoffset .6s}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:38px;font-weight:600;line-height:1}
.ring b sup{font-size:21px;font-weight:500;vertical-align:baseline;position:relative;top:-2px}
.ring small{color:var(--muted);font-size:13.5px}
.oc-list{flex:1;border-left:1px solid var(--line-soft);padding-left:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.oc-item{display:flex;align-items:center;gap:14px}
.oi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.oi.ok{background:#22c55e;box-shadow:0 0 14px rgba(34,197,94,.5)}
.oi.ring2{border:2px solid #7d8bd9}
.oi.cal{color:#a9b8ff;font-size:24px}
.oc-item small{color:var(--muted);display:block;font-size:13.5px}
.oc-item b{font-size:20px;font-weight:600;line-height:1.1}
.oc-foot{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
.oc-foot span{display:inline-flex;align-items:center;gap:6px}
.oc-foot .i{color:#ffb454;font-size:16px}
.datepill{display:flex;align-items:center;gap:2px;background:rgba(60,80,200,.2);border:1px solid var(--line-soft);border-radius:14px;padding:3px}
.dp{text-align:center;padding:0 6px;min-width:104px}
.dp b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.dp span{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 14px}
.tile{
  border-radius:16px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:1px solid var(--tb);background:var(--tg);
}
.tico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--tc);color:#fff;margin-bottom:4px}
.tile b{font-size:24px;font-weight:600;line-height:1.1}
.tile small{color:var(--muted);font-size:12px}
.t-ok{--tc:#22c55e;--tb:rgba(34,197,94,.5);--tg:rgba(34,197,94,.08)}
.t-prog{--tc:#7c6bff;--tb:rgba(124,107,255,.5);--tg:rgba(124,107,255,.09)}
.t-pend{--tc:#f59e0b;--tb:rgba(245,158,11,.5);--tg:rgba(245,158,11,.08)}
.t-urg{--tc:#f43f5e;--tb:rgba(244,63,94,.5);--tg:rgba(244,63,94,.08)}
.banner{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;font-size:14.5px;
  background:linear-gradient(90deg,rgba(90,60,240,.55),rgba(40,90,255,.5));border:1px solid rgba(130,150,255,.4);
}
.banner .bolt{font-size:26px;color:#a99bff;filter:drop-shadow(0 0 8px rgba(150,120,255,.8))}
.pheader{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pheader h2 .i{font-size:26px}
.plist{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.prow{
  display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 190px auto;gap:12px 22px;align-items:center;
  padding:12px 14px 12px 16px;background:rgba(8,14,58,.72);border:1px solid var(--line-soft);border-left:5px solid var(--c);border-radius:16px;
}
.pmain{display:flex;gap:14px;align-items:center;min-width:0}
.picon{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c3));display:grid;place-items:center;font-size:24px;color:#fff;box-shadow:0 0 18px var(--c2);flex:none}
.pinfo{min-width:0;flex:1}
.pinfo b{font-size:17px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo small{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbarw{display:flex;align-items:center;gap:10px;margin-top:6px}
.pbarw .bar{flex:1}
.pbarw em{font-style:normal;font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.pdays>span{font-size:13.5px;color:var(--muted);display:block}
.premind{display:flex;align-items:center;gap:12px;border-left:1px solid var(--line-soft);padding-left:16px}
.bellb{width:34px;height:34px;border-radius:50%;background:rgba(120,140,255,.16);color:#9aa6ff;display:grid;place-items:center;font-size:17px;flex:none}
.bellb:not(.on){opacity:.4}
.rtxt small{display:block;font-size:11px;color:var(--muted);line-height:1.25}
.rtxt b{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
.rx b.warn{color:#ff8a5c}.rx b.soon,.rx b.late{color:#ff5f6d}.rx b.ok{color:#4ade80}.rx b.dim{color:var(--dim)}
.pact{display:flex;align-items:center;gap:6px}
.chk-btn{width:46px;height:46px;border-radius:50%;border:2px solid #4c74ff;background:rgba(30,60,170,.35);color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 0 16px rgba(60,100,255,.35);transition:.15s}
.chk-btn:hover{background:#2f5fff}
.addrow{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:10px;padding:12px 16px;border-radius:16px;
  background:rgba(8,14,58,.55);border:1px dashed rgba(120,146,255,.5);
}
.addrow:hover{background:rgba(40,60,190,.25)}
.addrow .plus{width:40px;height:40px;border-radius:50%;border:1.5px solid #7d8bd9;display:grid;place-items:center;font-size:22px;color:#c5cfff;flex:none}
.addrow b{display:block;font-size:14.5px;font-weight:600}
.addrow small{color:var(--muted);font-size:12px}
.addrow>.i{margin-left:auto;font-size:22px;color:#8ea6ff}
.howto{display:flex;align-items:center;gap:16px;margin-top:20px;padding:16px 20px}
.howto .big{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#0f8a56,#1bbf7a);display:grid;place-items:center;font-size:26px;flex:none;box-shadow:0 0 20px rgba(34,197,94,.35)}
.howto b{font-size:16px;font-weight:600;display:block}
.howto p{color:var(--muted);font-size:13px}
.howto p .i{color:#4ade80;font-size:14px;vertical-align:-2px}
.done-pill{margin-left:auto;padding:9px 20px;border-radius:12px;border:1px solid #1bbf7a;color:#4ade80;background:rgba(27,191,122,.1);font-weight:600;font-size:14px;white-space:nowrap}
.hist-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.hist-item:last-child{border-bottom:0}
.hist-item .picon{width:40px;height:40px;font-size:19px}
.hist-item div{flex:1;min-width:0}
.hist-item b{display:block;font-size:14.5px}
.hist-item small{color:var(--muted);font-size:12.5px}

/* ---------- board ---------- */
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.stat small{color:var(--muted);font-size:12.5px;display:block}
.stat b{font-size:26px;font-weight:600;line-height:1.2}
.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:14px 16px;margin-bottom:14px;border-radius:18px}
.toolbar .field{min-width:160px}
.tb-actions{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.board-scroll{position:relative;overflow:auto;border:1px solid var(--line);border-radius:20px;background:rgba(6,10,48,.55);height:calc(100vh - 350px);min-height:420px}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);vertical-align:top;padding:8px}
.grid thead th{position:sticky;top:0;z-index:5;background:#0b1454;text-align:left;padding:10px 12px 12px;font-weight:400}
.grid thead th.proj{min-width:236px;width:236px;border-top:3px solid var(--c)}
.grid thead th.corner{left:0;z-index:7;min-width:136px;width:136px;font-weight:600;vertical-align:middle}
.grid thead th.addcol{min-width:150px;vertical-align:middle}
.grid .dayh{position:sticky;left:0;z-index:4;background:#0a1250;min-width:136px;width:136px;font-weight:400;text-align:left}
.grid tr.today .dayh{background:linear-gradient(rgba(110,130,255,.26),rgba(110,130,255,.26)),#0a1250;box-shadow:inset 4px 0 0 #8fa8ff}
.grid tr.today td{background:rgba(110,130,255,.1)}
.dh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dh b{font-size:15px;font-weight:600}
.dayh>span{display:block;font-size:12px;color:var(--muted)}
.dayh .bar{margin:7px 0 4px}
.dayh small{font-size:11px;color:var(--dim)}
.tbadge{font-style:normal;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:linear-gradient(90deg,#5a3df2,#2f63ff);color:#fff}
.ph{display:flex;align-items:center;gap:10px}
.pi{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c3));display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.pt{flex:1;min-width:0}
.pt b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt small{display:block;font-size:11.5px;color:var(--muted)}
.cbar{margin-top:9px}
.cbar>i,.proj .bar>i{background:var(--c)}
.proj.is-done{opacity:.72}
.proj.is-done .pt b::after{content:" ✓";color:#4ade80}
.cell{
  position:relative;display:flex;gap:6px;align-items:flex-start;padding:8px 8px 8px 10px;min-height:52px;
  background:var(--c1);border:1px solid var(--c2);border-radius:12px;transition:border-color .15s,background .15s;
}
.cell:focus-within{border-color:var(--c);background:var(--c2)}
.cell textarea{
  flex:1;width:100%;min-width:0;resize:none;background:transparent;border:0;outline:0;font-size:13.5px;line-height:1.4;
  min-height:34px;height:36px;field-sizing:content;overflow:hidden;padding-top:3px;
}
.cell textarea::placeholder{color:var(--dim)}
.cell.done textarea{color:var(--dim);text-decoration:line-through}
.cell.f-urgent{border-color:rgba(244,63,94,.75)}
.cell.f-progress{border-color:rgba(150,132,255,.8)}
.btns{display:flex;flex-direction:column;align-items:center;gap:6px}
.tick{width:28px;height:28px;border-radius:50%;border:1.6px solid var(--c);display:grid;place-items:center;color:transparent;font-size:16px;transition:.15s}
.tick:hover{background:var(--c2);color:#fff}
.cell.done .tick{background:var(--c);color:#fff;box-shadow:0 0 12px var(--c3)}
.flagb{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:14px;opacity:.75}
.flagb:hover{opacity:1;color:#fff}
.cell.f-progress .flagb{color:#b3a7ff;opacity:1}
.cell.f-urgent .flagb{color:#ff6b7c;opacity:1}
.cell.done .flagb{visibility:hidden}
.cell:not(.has) .btns{opacity:.4}
.days{display:flex;flex-direction:column;gap:12px}
.daycard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;scroll-margin-top:84px}
.daycard.today{border-color:#86a2ff;box-shadow:0 0 0 1px #86a2ff,0 0 26px rgba(90,120,255,.4)}
.daycard header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 10px;background:rgba(80,100,255,.1)}
.daycard header>div:first-child{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daycard header b{font-size:16px;font-weight:600}
.daycard header span{font-size:12.5px;color:var(--muted)}
.dpct{font-size:12.5px;color:var(--muted);white-space:nowrap}
.daycard>.bar{border-radius:0;height:3px}
.entry{padding:9px 12px 11px;border-top:1px solid var(--line-soft);border-left:4px solid var(--c)}
.elabel{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c);margin-bottom:5px}

/* ---------- calendar ---------- */
.cal-top{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;margin-bottom:16px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lp{color:#9db4ff}
.dot{width:9px;height:9px;border-radius:50%;border:1.6px solid var(--c);display:inline-block;flex:none}
.dot.on{background:var(--c);box-shadow:0 0 6px var(--c3)}
.month{margin-bottom:16px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dow,.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow span{text-align:center;font-size:11.5px;color:var(--dim);padding-bottom:4px}
.cd{
  min-height:92px;border-radius:12px;padding:6px 7px;display:flex;flex-direction:column;text-align:left;position:relative;
  background:linear-gradient(to top,var(--fillc,rgba(70,110,255,.3)) var(--fill,0%),rgba(10,18,72,.6) var(--fill,0%));
  border:1px solid var(--line-soft);transition:.15s;
}
.cd.blank{background:none;border:0}
.cd.out{background:rgba(6,10,40,.35);color:var(--dim);border-style:dashed}
button.cd:hover{border-color:#86a2ff}
.cd .dn{font-size:14px;font-weight:600}
.cd .dd{position:absolute;top:8px;right:8px;font-size:10px;color:var(--muted)}
.cd .dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cd .dots .dot{width:8px;height:8px}
.cd .cp{margin-top:auto;font-size:12px;font-weight:600}
.cd.today{border-color:#a9bdff;box-shadow:0 0 0 1.5px #a9bdff,0 0 18px rgba(110,140,255,.5)}
.cd.perfect{--fillc:rgba(34,197,94,.3);border-color:rgba(34,197,94,.6)}

/* ---------- progress ---------- */
.rows{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.prog-row{display:grid;grid-template-columns:200px 1fr 120px;gap:14px;align-items:center;padding:9px 6px;border-radius:12px}
.prog-row .nm2{display:flex;align-items:center;gap:10px;min-width:0}
.prog-row .nm2 .pi{width:30px;height:30px;font-size:15px}
.prog-row .nm2 b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.prog-row .nm2 small{color:var(--muted);font-size:12px;display:block}
.prog-row .bar{height:10px}
.prog-row .dv{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.prog-row .dv b{color:var(--text);font-weight:600}
button.prog-row{width:100%;text-align:left}
button.prog-row:hover{background:rgba(110,130,255,.1)}
.prog-row.today{background:rgba(110,130,255,.14);box-shadow:inset 3px 0 0 #8fa8ff}
.chart{display:flex;align-items:stretch;gap:3px;height:130px;overflow-x:auto;padding-bottom:2px;margin-top:14px}
.cb{flex:1 0 9px;max-width:30px;border-radius:6px;background:rgba(120,140,255,.1);display:flex;align-items:flex-end;overflow:hidden}
.cb i{display:block;width:100%;background:linear-gradient(180deg,#6f8fff,#7b3dff)}
.cb.today{box-shadow:0 0 0 1.5px #a9bdff}
.chart-axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:6px}

.note-item{margin-top:14px}
.ni-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ni-head b{font-size:15px}
.ni-head span{color:var(--muted);font-size:12.5px}
.ni-head .icon-btn{margin-left:auto}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.set-card{display:flex;flex-direction:column;gap:14px}
.set-card p{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(30,44,140,.3);font-size:13px}
.chip:hover{border-color:#86a2ff}
.chip.on{background:linear-gradient(90deg,#5a3df2,#2f5fff);border-color:transparent}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(2,4,20,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:100}
.modal{
  width:min(500px,100%);max-height:90vh;overflow:auto;padding:20px;border-radius:22px;
  background:linear-gradient(180deg,#101b6c,#080f48);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(70,90,255,.25);
}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.mhead h3{font-size:19px;font-weight:600}
.mhead p{color:var(--muted);font-size:13px}
.mtext{color:var(--muted);font-size:14px;margin-bottom:18px}
.mform{display:flex;flex-direction:column;gap:14px}
.mactions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:18px}
.swatches,.iconpick{display:flex;flex-wrap:wrap;gap:10px}

.sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(150,170,255,.6)}
.ip{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;color:var(--muted)}
.ip.on{background:linear-gradient(135deg,#5a3df2,#2f5fff);color:#fff;border-color:transparent}
.rem-row{display:flex;align-items:center;gap:14px}
.rem-row .inp{max-width:170px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text)!important}
.chk input{width:18px;height:18px;accent-color:#5a6cff}
.dlist{list-style:none;display:flex;flex-direction:column;gap:8px}

.dlist li>div{flex:1;min-width:0}
.dlist b{font-size:14px;display:block}
.dlist small{color:var(--muted);font-size:12.5px;display:block;overflow-wrap:anywhere}

.menu{position:fixed;z-index:120;min-width:200px;background:#0b1359;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.55)}

.menu button:hover{background:rgba(110,130,255,.18)}

.toast.show{opacity:1;transform:translate(-50%,0)}

  .pmain{grid-area:main}.pact{grid-area:act}.pdays{grid-area:days}

  .howto{flex-wrap:wrap;gap:12px;padding:14px}

  .done-pill{margin-left:0;width:100%;text-align:center}
  .cell{align-items:center;min-height:48px;padding:6px 8px 6px 10px}

const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`};
const cvars=c=>`--c:${c};--c1:${rgba(c,.09)};--c2:${rgba(c,.32)};--c3:${rgba(c,.6)}`;
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayISO=()=>isoOf(new Date());
const fmtLong=d=>`${MON3[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
const fmtShort=d=>`${DOW[d.getDay()]}, ${MON3[d.getMonth()]} ${d.getDate()}`;
const fmtTime=t=>{const [h,m]=String(t||'20:00').split(':').map(Number);return `${h%12||12}:${pad(m||0)} ${h>=12?'PM':'AM'}`};
const FS=!!(window.CSS&&CSS.supports&&CSS.supports('field-sizing','content'));
const mq=window.matchMedia('(max-width: 759px)');

/* =====================  state & storage  ===================== */
let storageOK=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}

function defaults(){
  const seed=[
    ['Bible Study','Read, meditate, apply','#8b5cf6','book','22:00'],
    ['Health & Fitness','Workout & healthy eating','#22c55e','dumbbell','20:00'],
    ['Work / Business','Handle tasks & grow','#3b82f6','laptop','18:00'],
    ['Family','Quality time & support','#f59e0b','users','21:00'],
    ['Personal Growth','Learn, build, improve','#ec4899','target','19:00'],
    ['Finances','Save, invest, manage','#14b8a6','coins','23:00']
  ];
  return {
    v:1,name:'Blessing Ponle',tagline:'Consistency builds the life you want.',
    startDate:todayISO(),numDays:30,
    projects:seed.map(([name,desc,color,icon,remind])=>({id:uid(),name,desc,color,icon,remind,remindOn:true,completed:false,completedAt:null})),
    cells:{},notes:{},fired:{},savedAt:null
  };
}
function sanitize(o){
  const s=defaults();
  if(!o||typeof o!=='object')return s;
  if(typeof o.name==='string')s.name=o.name.slice(0,30);
  if(typeof o.tagline==='string')s.tagline=o.tagline.slice(0,80);
  if(/^\d{4}-\d{2}-\d{2}$/.test(o.startDate||''))s.startDate=o.startDate;
  s.numDays=clamp(parseInt(o.numDays,10)||30,1,MAXDAYS);
  if(Array.isArray(o.projects)){
    const seen={};
    s.projects=o.projects.filter(p=>p&&typeof p==='object'&&typeof p.name==='string').map(p=>{
      let id=String(p.id||'').replace(/[^\w-]/g,'').slice(0,20)||uid();
      while(seen[id])id=uid();
      seen[id]=1;
      return {
        id,name:p.name.slice(0,30),desc:typeof p.desc==='string'?p.desc.slice(0,40):'',
        color:/^#[0-9a-f]{6}$/i.test(p.color||'')?p.color:COLORS[0],
        icon:ICONKEYS.includes(p.icon)?p.icon:'target',
        remind:/^\d{2}:\d{2}$/.test(p.remind||'')?p.remind:'20:00',
        remindOn:p.remindOn!==false,completed:!!p.completed,completedAt:typeof p.completedAt==='string'?p.completedAt:null
      };
    });
  }
  const ids=new Set(s.projects.map(p=>p.id));
  s.cells={};
  if(o.cells&&typeof o.cells==='object'){
    for(const k of Object.keys(o.cells)){
      const [pid,i]=k.split('|');const c=o.cells[k];
      if(!ids.has(pid)||!/^\d+$/.test(i||'')||!c||typeof c.t!=='string'||!c.t.trim())continue;
      s.cells[k]={t:c.t.slice(0,300),d:c.d?1:0,f:c.f==='progress'||c.f==='urgent'?c.f:''};
    }
  }
  s.notes={};
  if(o.notes&&typeof o.notes==='object'){
    for(const k of Object.keys(o.notes)){
      if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&typeof o.notes[k]==='string'&&o.notes[k].trim())s.notes[k]=o.notes[k].slice(0,200);
    }
  }
  s.fired=(o.fired&&typeof o.fired==='object')?o.fired:{};
  s.savedAt=typeof o.savedAt==='number'?o.savedAt:null;
  return s;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return sanitize(JSON.parse(raw))}catch(e){}
  return defaults();
}
let state=load();

function persist(){
  state.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;return true}
  catch(e){storageOK=false;return false}
}
let saveT=null;
function scheduleSave(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{persist();updateAutosave()},250);
}
function updateAutosave(){
  const el=$('#autosave');if(!el)return;
  if(!storageOK){el.textContent='Not saved';return}
  const d=new Date(state.savedAt||Date.now());
  el.textContent='Auto-saved '+fmtTime(`${d.getHours()}:${d.getMinutes()}`);
}
window.addEventListener('pagehide',()=>{clearTimeout(saveT);persist()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(saveT);persist()}});
window.addEventListener('storage',e=>{
  if(e.key===KEY&&e.newValue){try{state=sanitize(JSON.parse(e.newValue));ui.sel=clamp(ui.sel,0,N()-1);render(true)}catch(_){}}
});

/* =====================  ui state  ===================== */
const ui={view:'home',sel:0,editName:false,saved:false,savedT:null,showHistory:false,menuItems:null,confirm:null,today:todayISO(),lastFocus:null};

/* =====================  dates & stats  ===================== */
const N=()=>state.numDays;
const dateAt=i=>{const d=parseISO(state.startDate);d.setDate(d.getDate()+i);return d};
const dayIndexOf=iso=>Math.round((parseISO(iso)-parseISO(state.startDate))/86400000);
const todayIdx=()=>dayIndexOf(todayISO());
const inRange=i=>i>=0&&i<N();
ui.sel=clamp(todayIdx(),0,N()-1);

const key=(pid,i)=>pid+'|'+i;
const getCell=(pid,i)=>state.cells[key(pid,i)];
const planned=c=>!!(c&&c.t&&c.t.trim());

function dayStats(i){
  let pl=0,dn=0,pr=0,ur=0,pe=0;
  for(const p of state.projects){
    const c=getCell(p.id,i);if(!planned(c))continue;
    pl++;
    if(c.d)dn++;else if(c.f==='urgent')ur++;else if(c.f==='progress')pr++;else pe++;
  }
  return {planned:pl,done:dn,prog:pr,urgent:ur,pending:pe,pct:pl?Math.round(dn/pl*100):null};
}
function projStats(pid){
  let pl=0,dn=0;
  for(let i=0;i<N();i++){const c=getCell(pid,i);if(planned(c)){pl++;if(c.d)dn++}}
  return {planned:pl,done:dn,pct:pl?Math.round(dn/pl*100):0};
}
function totals(upTo){
  let pl=0,dn=0;const last=upTo==null?N()-1:Math.min(upTo,N()-1);
  for(let i=0;i<=last;i++)for(const p of state.projects){const c=getCell(p.id,i);if(planned(c)){pl++;if(c.d)dn++}}
  return {planned:pl,done:dn,pct:pl?Math.round(dn/pl*100):0};
}
function streak(){
  let i=Math.min(todayIdx(),N()-1);if(i<0)return 0;
  const ok=j=>{const s=dayStats(j);return s.planned>0&&s.done===s.planned};
  if(!ok(i))i--;
  let c=0;while(i>=0&&ok(i)){c++;i--}
  return c;
}
function planStatus(){
  const ti=todayIdx();
  if(ti<0)return `Starts in ${-ti} day${-ti>1?'s':''}`;
  if(ti>=N()){const n=ti-N()+1;return `Plan finished ${n} day${n>1?'s':''} ago`}
  return `Day ${ti+1} of ${N()}`;
}
function pctColor(p){return p==null?'#6d7ab8':p>=100?'#4ade80':p>=50?'#8fa8ff':p>0?'#fbbf24':'#ff7a8a'}
function dayMessage(i,s){
  const future=i>todayIdx();
  if(!s.planned)return future?'Nothing planned yet. Open the Board and add what you will do this day.':'Nothing planned for this day. Add a plan on the Board to track it.';
  if(s.pct===100)return 'Perfect day! Everything you planned is done.';
  if(future)return 'Your plan is set. Show up and tick it off.';
  if(s.done===0)return 'Start with one task. Momentum builds fast.';
  if(s.pct>=50)return 'Keep going! You are building better habits every day.';
  return 'Good start. Every tick counts toward the life you want.';
}
function remindInfo(p){
  const ti=todayIdx();
  if(!inRange(ti))return {label:'Today',txt:'Outside plan',cls:'dim'};
  const c=getCell(p.id,ti);
  if(!planned(c))return {label:'Today',txt:'Nothing planned',cls:'dim'};
  if(c.d)return {label:'Today',txt:'Done ✓',cls:'ok'};
  const [h,m]=p.remind.split(':').map(Number);const now=new Date();
  const end=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);
  const diff=Math.ceil((end-now)/60000);
  if(diff<=0)return {label:'Status',txt:'Overdue',cls:'late'};
  const hh=Math.floor(diff/60),mm=diff%60;
  return {label:'Expires in',txt:hh?`${hh}h ${mm}m`:`${mm}m`,cls:diff<=60?'soon':'warn'};
}
const rxHTML=p=>{const r=remindInfo(p);return `<small>${r.label}</small><b class="${r.cls}">${r.txt}</b>`};

/* =====================  toast, menu, modal  ===================== */
let toastT=null;
function toast(msg,ms){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms||2400);
}
function openMenu(anchor,items){
  ui.menuItems=items;
  const m=$('#menu');
  m.innerHTML=items.map((it,k)=>`<button class="${it.danger?'danger':''}" data-action="menu-item" data-mi="${k}">${it.icon?ic(it.icon):''}<span>${esc(it.label)}</span></button>`).join('');
  m.hidden=false;
  const r=anchor.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
  m.style.left=clamp(r.right-w,8,innerWidth-w-8)+'px';
  let top=r.bottom+6;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6);
  m.style.top=top+'px';
}
function closeMenu(){$('#menu').hidden=true;ui.menuItems=null}
function openModal(html){
  ui.lastFocus=document.activeElement;
  $('#modalBody').innerHTML=html;
  $('#modal').hidden=false;
  const f=$('#modalBody input:not([type=checkbox]),#modalBody .btn.primary');
  if(f)setTimeout(()=>f.focus(),30);
}
function closeModal(result){
  $('#modal').hidden=true;$('#modalBody').innerHTML='';
  if(ui.confirm){const r=ui.confirm;ui.confirm=null;r(!!result)}
  if(ui.lastFocus&&ui.lastFocus.focus&&document.contains(ui.lastFocus))try{ui.lastFocus.focus()}catch(e){}
}
function confirmBox({title,text,ok,danger}){
  return new Promise(res=>{
    openModal(`<div class="mhead"><h3>${esc(title)}</h3></div><p class="mtext">${esc(text)}</p>
      <div class="mactions"><button class="btn" data-action="confirm-no">Cancel</button>
      <button class="btn ${danger?'danger solid':'primary'}" data-action="confirm-yes">${esc(ok||'Confirm')}</button></div>`);
    ui.confirm=res;
  });
}

const flagIcon=f=>f==='progress'?ic('half'):f==='urgent'?ic('alert'):ic('flag');
const flagTitle=f=>f==='progress'?'In progress — click to mark Urgent':f==='urgent'?'Urgent — click to clear':'Pending — click to mark In progress';
function cellHTML(p,i,mob){
  const c=getCell(p.id,i)||{},has=planned(c),f=c.f||'';
  return `<div class="cell ${has?'has':''} ${c.d?'done':''} ${f&&!c.d?'f-'+f:''}" style="${cvars(p.color)}" data-p="${p.id}" data-d="${i}">

    <div class="btns"><button class="flagb" data-action="flag" title="${flagTitle(f)}" aria-label="Change status">${flagIcon(f)}</button>
    <button class="tick" data-action="tick" aria-pressed="${!!c.d}" aria-label="Mark done" title="Mark done">${ic('check')}</button></div></div>`;
}
const colLabel=(st,p)=>`${st.done}/${st.planned} done · ${st.pct}%`;
const rowLabel=s=>s.planned?`${s.done}/${s.planned} · ${s.pct}%`:'No plans';
function tableHTML(){
  const ti=todayIdx();
  const head=state.projects.map(p=>{const st=projStats(p.id);
    return `<th class="proj ${p.completed?'is-done':''}" style="${cvars(p.color)}" scope="col"><div class="ph"><span class="pi">${ic(p.icon)}</span>
      <div class="pt"><b title="${esc(p.name)}">${esc(p.name)}</b><small data-col="${p.id}">${colLabel(st,p)}</small></div>
      <button class="icon-btn sm" data-action="proj-menu" data-pid="${p.id}" aria-label="Options for ${esc(p.name)}">${ic('more')}</button></div>
      <div class="bar thin cbar"><i data-colbar="${p.id}" style="width:${st.pct}%"></i></div></th>`}).join('');
  let rows='';
  for(let i=0;i<N();i++){

function boardHTML(){

    <div class="stat"><small>Planned</small><b data-live="planned">${t.planned}</b></div>

function setLive(k,v){$$(`[data-live="${k}"]`).forEach(e=>e.textContent=v)}
function liveBoard(pid,i){
  const t=totals();
  setLive('projects',state.projects.length);setLive('planned',t.planned);setLive('done',t.done);setLive('pct',t.pct+'%');
  const p=state.projects.find(x=>x.id===pid);
  if(p){const ps=projStats(pid);$$(`[data-col="${pid}"]`).forEach(e=>e.textContent=colLabel(ps,p));$$(`[data-colbar="${pid}"]`).forEach(e=>e.style.width=ps.pct+'%')}
  const s=dayStats(i);
  $$(`[data-row="${i}"]`).forEach(e=>e.textContent=rowLabel(s));
  $$(`[data-daycard="${i}"]`).forEach(e=>e.textContent=rowLabel(s));
  $$(`[data-rowbar="${i}"]`).forEach(e=>e.style.width=(s.pct||0)+'%');
}
function applyCellClasses(cell,c){
  const f=c&&c.f||'';
  cell.classList.toggle('has',planned(c));
  cell.classList.toggle('done',!!(c&&c.d));
  cell.classList.toggle('f-progress',!(c&&c.d)&&f==='progress');
  cell.classList.toggle('f-urgent',!(c&&c.d)&&f==='urgent');
  const fb=$('.flagb',cell);fb.innerHTML=flagIcon(f);fb.title=flagTitle(f);
  $('.tick',cell).setAttribute('aria-pressed',String(!!(c&&c.d)));
}
function autosize(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'}
function onCellInput(ta){
  const cell=ta.closest('.cell'),pid=cell.dataset.p,i=+cell.dataset.d,k=key(pid,i);
  if(!ta.value.trim()){delete state.cells[k];applyCellClasses(cell,null)}
  else{
    let c=state.cells[k];if(!c)c=state.cells[k]={t:'',d:0,f:''};
    c.t=ta.value;cell.classList.add('has');
  }
  if(!FS)autosize(ta);
  liveBoard(pid,i);scheduleSave();
}
function tickCell(cell){
  const pid=cell.dataset.p,i=+cell.dataset.d,c=state.cells[key(pid,i)];
  if(!planned(c)){toast('Type your plan first, then tick it off.');$('textarea',cell).focus();return}
  c.d=c.d?0:1;applyCellClasses(cell,c);liveBoard(pid,i);scheduleSave();
  if(c.d){const s=dayStats(i);if(s.planned&&s.done===s.planned)toast(`Day ${i+1} complete — every task done ✓`)}
}
function flagCell(cell){
  const pid=cell.dataset.p,i=+cell.dataset.d,c=state.cells[key(pid,i)];
  if(!planned(c)){toast('Type your plan first, then set its status.');$('textarea',cell).focus();return}
  c.f=c.f===''||!c.f?'progress':c.f==='progress'?'urgent':'';
  applyCellClasses(cell,c);liveBoard(pid,i);scheduleSave();
}
function scrollToToday(smooth){
  const ti=todayIdx();
  if(!inRange(ti))return;
  if(mq.matches){const el=$(`.daycard[data-day="${ti}"]`);if(el)el.scrollIntoView({block:'start',behavior:smooth?'smooth':'auto'})}
  else{const sc=$('.board-scroll'),row=$(`tr[data-day="${ti}"]`);if(sc&&row)sc.scrollTo({top:Math.max(0,row.offsetTop-sc.clientHeight/3),behavior:smooth?'smooth':'auto'})}
}

/* =====================  CALENDAR  ===================== */
function monthsInPlan(){
  const s=dateAt(0),e=dateAt(N()-1),out=[];
  let y=s.getFullYear(),m=s.getMonth();
  while(y<e.getFullYear()||(y===e.getFullYear()&&m<=e.getMonth())){out.push({y,m});m++;if(m>11){m=0;y++}}
  return out;
}
function monthHTML(y,m,ti){
  const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  let pl=0,dn=0,cells='';
  for(let b=0;b<first;b++)cells+='<span class="cd blank"></span>';
  for(let day=1;day<=dim;day++){
    const dt=new Date(y,m,day),idx=dayIndexOf(isoOf(dt));
    if(!inRange(idx)){cells+=`<span class="cd out"><span class="dn">${day}</span></span>`;continue}
    const s=dayStats(idx);pl+=s.planned;dn+=s.done;
    const dots=state.projects.map(p=>{const c=getCell(p.id,idx);return planned(c)?`<i class="dot ${c.d?'on':''}" style="--c:${p.color};--c3:${rgba(p.color,.6)}"></i>`:''}).join('');
    cells+=`<button class="cd ${idx===ti?'today':''} ${s.pct===100?'perfect':''}" style="--fill:${s.pct||0}%" data-action="cal-day" data-d="${idx}"
      aria-label="Day ${idx+1}, ${fmtLong(dt)}, ${s.planned?s.pct+'% complete':'nothing planned'}">
      <span class="dn">${day}</span><span class="dd">D${idx+1}</span><span class="dots">${dots}</span>
      <span class="cp" style="color:${pctColor(s.pct)}">${s.pct==null?'':s.pct+'%'}</span></button>`;
  }
  return `<section class="card month"><div class="mh"><h2>${MONTHS[m]} ${y}</h2><span class="sub">${pl?`${dn}/${pl} done · ${Math.round(dn/pl*100)}%`:'Nothing planned'}</span></div>
    <div class="dow">${DOW.map(x=>`<span>${x}</span>`).join('')}</div><div class="mgrid">${cells}</div></section>`;
}
function calendarHTML(){
  const ti=todayIdx();
  return `<div class="card cal-top"><div><h2>${ic('calendar')}Calendar</h2><p class="sub">${fmtLong(dateAt(0))} to ${fmtLong(dateAt(N()-1))} · ${N()} days</p></div>
    <div class="legend"><span><i class="dot on" style="--c:#8b5cf6;--c3:rgba(139,92,246,.6)"></i>Done</span><span><i class="dot" style="--c:#8b5cf6"></i>Planned, not done</span><span><b class="lp">%</b>Day consistency</span></div></div>`
    +monthsInPlan().map(({y,m})=>monthHTML(y,m,ti)).join('');
}
function dayModalHTML(i){
  const d=dateAt(i),s=dayStats(i),note=state.notes[isoOf(d)];
  return `<div class="mhead"><div><h3>Day ${i+1}${i===todayIdx()?' · Today':''}</h3><p>${WD[d.getDay()]}, ${fmtLong(d)} · ${s.pct==null?'nothing planned':s.done+'/'+s.planned+' done · '+s.pct+'%'}</p></div>
    <button class="icon-btn" data-action="close-modal" aria-label="Close">${ic('x')}</button></div>
    <div class="bar" style="margin-bottom:14px"><i style="width:${s.pct||0}%"></i></div>
    ${state.projects.length?`<ul class="dlist">${state.projects.map(p=>{const c=getCell(p.id,i)||{},has=planned(c);
      return `<li class="${c.d?'done':''}" style="${cvars(p.color)}"><span class="pi" style="${cvars(p.color)}">${ic(p.icon)}</span><div><b>${esc(p.name)}</b><small>${has?esc(c.t):'Nothing planned'}</small></div>
      ${has?`<button class="tick" style="${cvars(p.color)};${c.d?`background:${p.color};color:#fff`:''}" data-action="modal-tick" data-p="${p.id}" data-d="${i}" aria-pressed="${!!c.d}" aria-label="Mark ${esc(p.name)} done">${ic('check')}</button>`:''}</li>`}).join('')}</ul>`:'<p class="sub">No projects yet.</p>'}
    ${note?`<div class="mnote">${ic('edit')} ${esc(note)}</div>`:''}

}

  const tot=totals(),ti=todayIdx(),sofar=totals(Math.min(ti,N()-1)),st=streak();
  const sofarPct=ti<0?0:sofar.pct;
  const stats=`<div class="stats4">
    <div class="stat"><small>Overall</small><b>${tot.pct}%</b></div>
    <div class="stat"><small>So far</small><b>${sofarPct}%</b></div>

    <div class="stat"><small>Done / planned</small><b>${tot.done}/${tot.planned}</b></div></div>`;
  let bars='';
  for(let i=0;i<N();i++){const s=dayStats(i);bars+=`<div class="cb ${i===ti?'today':''}" title="Day ${i+1} · ${s.pct==null?'no plans':s.pct+'%'}"><i style="height:${s.pct||0}%"></i></div>`}
  const chart=`<section class="card"><h2>${ic('bars')}Consistency by day</h2><p class="sub" style="margin-top:2px">Each bar is one day's completion. ${planStatus()}.</p>
    <div class="chart">${bars}</div><div class="chart-axis"><span>Day 1</span><span>Day ${N()}</span></div></section>`;
  const byProj=`<section class="card"><h2>${ic('folder')}By project</h2>${state.projects.length?`<div class="rows">${state.projects.map(p=>{const ps=projStats(p.id);
    return `<div class="prog-row" style="${cvars(p.color)}"><div class="nm2"><span class="pi">${ic(p.icon)}</span><div style="min-width:0"><b>${esc(p.name)}</b><small>${ps.done} of ${N()} days done${p.completed?' · completed':''}</small></div></div>
    <div class="bar"><i style="width:${ps.pct}%;background:${p.color}"></i></div><div class="dv"><b>${ps.pct}%</b> · ${ps.done}/${ps.planned}</div></div>`}).join('')}</div>`:'<p class="sub" style="margin-top:10px">No projects yet.</p>'}</section>`;
  let dr='';
  for(let i=0;i<N();i++){const d=dateAt(i),s=dayStats(i);
    dr+=`<button class="prog-row ${i===ti?'today':''}" data-action="cal-day" data-d="${i}"><div class="nm2"><div style="min-width:0"><b>Day ${i+1}${i===ti?' · Today':''}</b><small>${fmtShort(d)}</small></div></div>
    <div class="bar"><i style="width:${s.pct||0}%;background:${s.pct===100?'#22c55e':''}"></i></div><div class="dv">${s.planned?`<b>${s.pct}%</b> · ${s.done}/${s.planned}`:'No plans'}</div></button>`}
  const byDay=`<section class="card"><h2>${ic('calendar')}By day</h2><div class="rows">${dr}</div></section>`;
  return `<div class="stack">${stats}${chart}${byProj}${byDay}</div>`;
}

/* =====================  project actions  ===================== */
function nextColor(){const used=state.projects.map(p=>p.color);return COLORS.find(c=>!used.includes(c))||COLORS[state.projects.length%COLORS.length]}
function openProjectForm(pid){
  const p=pid?state.projects.find(x=>x.id===pid):null;
  const f={name:p?p.name:'',desc:p?p.desc:'',color:p?p.color:nextColor(),icon:p?p.icon:'target',remind:p?p.remind:'20:00',remindOn:p?p.remindOn:true};
  openModal(`<div class="mhead"><h3>${p?'Edit project':'Add project'}</h3><button class="icon-btn" data-action="close-modal" aria-label="Close">${ic('x')}</button></div>
    <div class="mform">
      <div class="field"><label for="pfName">Project name</label><input class="inp" id="pfName" maxlength="30" value="${esc(f.name)}" placeholder="e.g. Reading"></div>
      <div class="field"><label for="pfDesc">Short description</label><input class="inp" id="pfDesc" maxlength="40" value="${esc(f.desc)}" placeholder="e.g. 20 pages a day"></div>
      <div class="field"><label>Colour</label><div class="swatches" id="pfColors">${COLORS.map(c=>`<button type="button" class="sw ${c===f.color?'on':''}" data-action="pick-color" data-color="${c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')}</div></div>
      <div class="field"><label>Icon</label><div class="iconpick" id="pfIcons">${ICONKEYS.map(k=>`<button type="button" class="ip ${k===f.icon?'on':''}" data-action="pick-icon" data-icon="${k}" aria-label="${k}">${ic(k)}</button>`).join('')}</div></div>
      <div class="field"><label for="pfTime">Daily reminder time</label><div class="rem-row"><input class="inp" type="time" id="pfTime" value="${f.remind}"><label class="chk"><input type="checkbox" id="pfRem" ${f.remindOn?'checked':''}>Remind me</label></div></div>
    </div>
    <div class="mactions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-project" data-pid="${pid||''}">${p?'Save changes':'Add project'}</button></div>`);
}
function saveProjectForm(pid){
  const name=$('#pfName').value.trim();
  if(!name){$('#pfName').focus();toast('Give the project a name.');return}
  const data={
    name,desc:$('#pfDesc').value.trim(),
    color:($('#pfColors .sw.on')||{dataset:{color:COLORS[0]}}).dataset.color,
    icon:($('#pfIcons .ip.on')||{dataset:{icon:'target'}}).dataset.icon,
    remind:$('#pfTime').value||'20:00',remindOn:$('#pfRem').checked
  };
  if(pid){Object.assign(state.projects.find(p=>p.id===pid),data)}
  else state.projects.push(Object.assign({id:uid(),completed:false,completedAt:null},data));
  scheduleSave();closeModal();render(true);toast(pid?'Project updated':'Project added');
}
async function completeProject(pid){
  const p=state.projects.find(x=>x.id===pid);if(!p)return;
  const st=projStats(pid),left=st.planned-st.done;
  const text=st.planned===0?'No tasks are planned for this project yet. It will move to your history.'
    :left>0?`${left} planned task${left>1?'s are':' is'} not ticked yet. Mark it as completed anyway? It moves to your history and its record stays on the Board.`
    :`All ${st.planned} planned tasks are done. It will move to your history and its record stays on the Board.`;
  if(!await confirmBox({title:`Mark "${p.name}" as completed?`,text,ok:'Mark completed'}))return;
  p.completed=true;p.completedAt=todayISO();scheduleSave();render(true);toast('Project completed. Well done!');
}
async function deleteProject(pid){
  const p=state.projects.find(x=>x.id===pid);if(!p)return;
  if(!await confirmBox({title:`Delete "${p.name}"?`,text:'Its plans and ticks for every day will be removed permanently.',ok:'Delete project',danger:true}))return;
  state.projects=state.projects.filter(x=>x.id!==pid);
  for(const k of Object.keys(state.cells))if(k.startsWith(pid+'|'))delete state.cells[k];
  delete state.fired[pid];
  scheduleSave();render(true);toast('Project deleted');
}
function projMenu(anchor,pid){
  const p=state.projects.find(x=>x.id===pid);if(!p)return;
  const items=[{label:'Edit project',icon:'edit',run:()=>openProjectForm(pid)}];
  if(ui.view!=='board')items.push({label:'Open on Board',icon:'columns',run:()=>go('board')});
  items.push(p.completed?{label:'Restore to active',icon:'undo',run:()=>{p.completed=false;p.completedAt=null;scheduleSave();render(true)}}
    :{label:'Mark as completed',icon:'check',run:()=>completeProject(pid)});
  items.push({label:'Delete project',icon:'trash',danger:true,run:()=>deleteProject(pid)});
  openMenu(anchor,items);
}

/* =====================  plan, data, reminders  ===================== */
function setStart(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){render(true);return}
  state.startDate=v;ui.sel=clamp(todayIdx(),0,N()-1);persist();render(true);
  toast('Start date updated. Plans stay with their Day numbers.');
}
function setDays(v){
  let n=parseInt(v,10);
  if(isNaN(n)){render(true);return}
  const c=clamp(n,1,MAXDAYS);
  state.numDays=c;ui.sel=clamp(ui.sel,0,c-1);persist();render(true);
  toast(c!==n?`Set to ${c} days (allowed: 1 to ${MAXDAYS})`:`Now tracking ${c} day${c>1?'s':''}`);
}
function exportData(){
  if(window.AndroidBridge&&window.AndroidBridge.shareBackup){window.AndroidBridge.shareBackup(`consistency-board-backup-${todayISO()}.json`,JSON.stringify(state,null,2));toast('Choose where to save your backup');return}
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`consistency-board-backup-${todayISO()}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Backup downloaded');
}
async function importData(file){
  if(!file)return;
  try{
    const obj=JSON.parse(await file.text());
    if(!obj||!Array.isArray(obj.projects))throw new Error('bad');
    if(!await confirmBox({title:'Replace your current board?',text:'Importing a backup replaces everything on this device with the contents of that file.',ok:'Import backup',danger:true}))return;
    state=sanitize(obj);ui.sel=clamp(todayIdx(),0,N()-1);persist();render(false);toast('Backup imported');
  }catch(e){toast('That file is not a valid backup.')}
}
async function resetAll(){
  if(!await confirmBox({title:'Reset everything?',text:'All projects, plans, ticks and notes on this device will be deleted. Export a backup first if you might want them back.',ok:'Reset everything',danger:true}))return;
  state=defaults();ui.sel=clamp(todayIdx(),0,N()-1);ui.view='home';persist();render(false);toast('Board reset');
}
function checkReminders(){
  const ti=todayIdx();if(!inRange(ti))return;
  const now=new Date(),today=todayISO(),mins=now.getHours()*60+now.getMinutes();
  state.projects.forEach(p=>{
    if(p.completed||!p.remindOn)return;
    const [h,m]=p.remind.split(':').map(Number),t=h*60+m;
    if(mins<t||mins>t+10||state.fired[p.id]===today)return;
    const c=getCell(p.id,ti);if(!planned(c)||c.d)return;
    state.fired[p.id]=today;scheduleSave();
    toast(`Reminder: ${p.name} — ${c.t.slice(0,60)}`,7000);
    try{if('Notification' in window&&Notification.permission==='granted')new Notification(p.name,{body:c.t})}catch(e){}
  });
}
function tickClock(){
  const t=todayISO();
  if(t!==ui.today){ui.today=t;ui.sel=clamp(todayIdx(),0,N()-1);render(true);return}
  $$('[data-exp]').forEach(el=>{const p=state.projects.find(x=>x.id===el.dataset.exp);if(p)el.innerHTML=rxHTML(p)});
  checkReminders();
}
setInterval(tickClock,30000);

/* =====================  events  ===================== */
document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('#menu'))closeMenu();
  if(t.id==='modal'){closeModal(false);return}
  const a=t.closest('[data-action]');if(!a)return;
  const act=a.dataset.action,pid=a.dataset.pid;
  switch(act){
    case 'nav':go(a.dataset.view);break;
    case 'save':{
      clearTimeout(saveT);
      if(persist()){
        ui.saved=true;renderTop();toast('Saved ✓ Your work is stored in this browser');
        clearTimeout(ui.savedT);ui.savedT=setTimeout(()=>{ui.saved=false;renderTop()},2200);
      }else{toast('Could not save. Browser storage is blocked here.',4000);render(true)}
      break}
    case 'edit-name':ui.editName=true;renderTop();break;
    case 'main-menu':openMenu(a,[
      {label:'All notes',icon:'notes',run:()=>go('notes')},
      {label:'Export backup',icon:'download',run:exportData},
      {label:'Import backup',icon:'upload',run:()=>$('#importFile').click()},
      {label:'Reset everything',icon:'trash',danger:true,run:resetAll}]);break;
    case 'menu-item':{const it=ui.menuItems&&ui.menuItems[+a.dataset.mi];closeMenu();if(it)it.run();break}
    case 'sel-prev':ui.sel=Math.max(0,ui.sel-1);render(true);break;
    case 'sel-next':ui.sel=Math.min(N()-1,ui.sel+1);render(true);break;
    case 'sel-today':ui.sel=clamp(todayIdx(),0,N()-1);render(true);break;
    case 'add-project':openProjectForm(null);break;
    case 'proj-menu':projMenu(a,pid);break;
    case 'complete-project':completeProject(pid);break;
    case 'delete-project':deleteProject(pid);break;
    case 'restore-project':{const p=state.projects.find(x=>x.id===pid);if(p){p.completed=false;p.completedAt=null;scheduleSave();render(true);toast('Project restored')}break}
    case 'toggle-history':ui.showHistory=!ui.showHistory;render(true);break;
    case 'toggle-remind':{
      const p=state.projects.find(x=>x.id===pid);if(!p)break;
      p.remindOn=!p.remindOn;scheduleSave();render(true);
      toast(p.remindOn?`Reminder on for ${p.name}`:`Reminder off for ${p.name}`);
      if(p.remindOn&&'Notification' in window&&Notification.permission==='default')try{Notification.requestPermission()}catch(_){}
      break}
    case 'tick':tickCell(a.closest('.cell'));break;
    case 'flag':flagCell(a.closest('.cell'));break;
    case 'jump-today':{
      const ti=todayIdx();
      if(!inRange(ti))toast(ti<0?`Your plan starts in ${-ti} day${-ti>1?'s':''}.`:'Your plan has finished. Extend the number of days to keep going.');
      else scrollToToday(true);
      break}
    case 'cal-day':openModal(dayModalHTML(+a.dataset.d));break;
    case 'modal-tick':{
      const i=+a.dataset.d,c=state.cells[key(a.dataset.p,i)];
      if(c&&planned(c)){c.d=c.d?0:1;scheduleSave();$('#modalBody').innerHTML=dayModalHTML(i);render(true)}
      break}
    case 'modal-summary':ui.sel=+a.dataset.d;closeModal();go('home');break;
    case 'modal-board':{const i=+a.dataset.d;closeModal();ui.view='board';render(false);
      const el=mq.matches?$(`.daycard[data-day="${i}"]`):$(`tr[data-day="${i}"]`);
      if(el){if(mq.matches)el.scrollIntoView({block:'start'});else{const sc=$('.board-scroll');sc.scrollTop=Math.max(0,el.offsetTop-sc.clientHeight/3)}}
      break}
    case 'close-modal':closeModal(false);break;
    case 'confirm-yes':closeModal(true);break;
    case 'confirm-no':closeModal(false);break;
    case 'pick-color':$$('#pfColors .sw').forEach(x=>x.classList.toggle('on',x===a));break;
    case 'pick-icon':$$('#pfIcons .ip').forEach(x=>x.classList.toggle('on',x===a));break;
    case 'save-project':saveProjectForm(pid||null);break;
    case 'set-days':setDays(a.dataset.n);break;
    case 'enable-notif':
      if(!('Notification' in window)){toast('This browser does not support notifications.')}
      else Notification.requestPermission().then(()=>{if(ui.view==='settings')render(true)}).catch(()=>toast('Could not turn on notifications.'));
      break;
    case 'export':exportData();break;
    case 'import':$('#importFile').click();break;
    case 'reset':resetAll();break;
    case 'add-note':{
      const dt=$('#newNoteDate').value,tx=$('#newNoteText').value.trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||!tx){toast('Pick a date and write a note first.');break}
      state.notes[dt]=(state.notes[dt]?state.notes[dt]+' ':'')+tx;state.notes[dt]=state.notes[dt].slice(0,200);
      scheduleSave();render(true);toast('Note added');break}
    case 'del-note':delete state.notes[a.dataset.nk];scheduleSave();render(true);break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.role==='cell')onCellInput(t);
  else if(t.id==='noteBox'){
    const k=isoOf(dateAt(ui.sel)),v=t.value.slice(0,200);
    if(v.trim())state.notes[k]=v;else delete state.notes[k];
    $('#noteCount').textContent=v.length+'/200';
    if(!FS)autosize(t);
    scheduleSave();
  }
  else if(t.dataset.role==='note-edit'){
    const v=t.value.slice(0,200);if(v.trim())state.notes[t.dataset.nk]=v;else delete state.notes[t.dataset.nk];scheduleSave();
  }
  else if(t.id==='setName'){state.name=t.value.slice(0,30);scheduleSave();renderTop()}
  else if(t.id==='setTag'){state.tagline=t.value.slice(0,80);scheduleSave();renderTop()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='startDate')setStart(t.value);
  else if(t.id==='numDays')setDays(t.value);
  else if(t.id==='importFile'){importData(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'){if(!$('#modal').hidden)closeModal(false);closeMenu();if(ui.editName){ui.editName=false;renderTop()}return}
  if(t.dataset&&t.dataset.role==='cell'&&e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const cell=t.closest('.cell'),nxt=$(`.cell[data-p="${cell.dataset.p}"][data-d="${+cell.dataset.d+1}"] textarea`);
    if(nxt)nxt.focus();else t.blur();
  }
  if(t.id==='nameInp'&&e.key==='Enter'){t.blur()}
  if(t.id==='numDays'&&e.key==='Enter'){t.blur()}
  if(t.id==='pfName'&&e.key==='Enter'){const b=$('[data-action="save-project"]');if(b)b.click()}
});
document.addEventListener('focusout',e=>{
  if(e.target.id==='nameInp'&&ui.editName){
    const v=e.target.value.trim();if(v)state.name=v.slice(0,30);
    ui.editName=false;scheduleSave();renderTop();
  }
});
window.addEventListener('resize',()=>closeMenu());

/* =====================  start  ===================== */
render(false);
setTimeout(checkReminders,1500);
})();
</script>
</body>
</html>
